name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run links
      - run: bun install --frozen-lockfile
        working-directory: site
      # TypeDoc 0.28.20 needs minimatch 10, and the fix of this advisory is in minimatch 11 alone. The site's globs
      # are its own configuration. Remove the ignore once TypeDoc depends on a minimatch with the fix.
      - run: bun audit --ignore=GHSA-g3hv-75wg-m249
        working-directory: site
      # The build fails on a warning of TypeDoc by itself.
      - run: bun run build
        working-directory: site

  # `bun test`, its files dealt among four jobs that run at once. Each job runs its files alone on its runner, as one
  # job ran them all (decision 0242).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test --shard=${{ matrix.shard }}/4

  # The spikes, which `bun test` runs none of, on every push as at each move of Effect or Bun (decision 0250).
  spikes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:spikes

  # The files whose tests wait on a clock that is real, Cluster's and the server example's, every test of them: those
  # over two seconds, which `bun test` skips, run under `SCHEDULES=all` alone (decision 0250).
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:slow

  # Each seed pinned in an explored test, run against the rule it holds taken out, so that a change that moves a yield
  # and loses a pinned seed's interleaving fails here (decision 0254).
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:pins

  # The tests of the storage and of the runtime on a server of PostgreSQL with a pool, and a database of SQLite on a
  # volume that fills up (decisions 0222, 0223).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:postgres
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Mount a volume of 32 MB
        run: |
          fallocate -l 32M "$RUNNER_TEMP/volume.img"
          mkfs.ext4 -q -m 0 "$RUNNER_TEMP/volume.img"
          sudo mkdir -p /mnt/full
          sudo mount -o loop "$RUNNER_TEMP/volume.img" /mnt/full
          sudo chown "$(id -u):$(id -g)" /mnt/full
      - run: bun test '--path-ignore-patterns=node_modules/**' ./spikes/full-volume.test.ts
        env:
          FULL_VOLUME: /mnt/full

  # Every seed of the explored tests, which a release passes, dealt among four jobs as `bun test` is. Run by hand from
  # the repository's Actions.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:release --shard=${{ matrix.shard }}/4
